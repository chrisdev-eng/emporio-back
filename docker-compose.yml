services:
  postgres:
    image: postgres:18
    container_name: pdvediel-postgres
    environment:
      POSTGRES_DB: pdvediel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdvediel"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: pdvediel-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pdvediel
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: