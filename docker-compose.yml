services:
  postgres:
    image: postgres:18
    container_name: pdvediel-postgres
    environment:
      POSTGRES_DB: pdvediel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5555:5432"
    volumes:
      - postges_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdvediel"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: