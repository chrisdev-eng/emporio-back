spring:
  application:
    name: pdvEdiel

  datasource:
    url: jdbc:postgresql://localhost:5432/pdv
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true